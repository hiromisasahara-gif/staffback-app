<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>キープボトル管理</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ボトル管理">
<meta name="theme-color" content="#0a0a0f">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="お客様のキープボトルと来店・保管期限・廃棄履歴を管理するアプリ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0a0f;--sf:#13131c;--sf2:#1a1a26;--bd:#272738;--ac:#c8a96e;--ac2:#e8c98e;--acd:rgba(200,169,110,.15);--tx:#e8e8f0;--mu:#6a6a8a;--sb:#9a9ab8;--gn:#5ecb8a;--rd:#e06c75;--bl:#7eb8f7;--gl:#f5d76e;--sl:#c0c0d0;--bz:#cd7f50;--or:#f0a058;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;width:100%;}
body{background:var(--bg);color:var(--tx);font-family:'Noto Sans JP',sans-serif;min-height:100vh;min-height:100dvh;}
button,input,select,textarea{font-family:inherit;}

/* ── TOP BAR ── */
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;}
.topbar .back{background:none;border:none;color:var(--sb);font-size:22px;cursor:pointer;padding:6px;line-height:1;min-width:40px;min-height:40px;display:none;}
.topbar .back.show{display:block;}
.topbar .brand{font-size:14px;font-weight:700;color:var(--ac);letter-spacing:.08em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .staffpill{font-size:11px;color:var(--sb);background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;white-space:nowrap;}

.screen{display:none;padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;}
.screen.active{display:block;}
.full{max-width:none;}

/* ── SEARCH ── */
.search-wrap{position:relative;margin-bottom:10px;}
.search-input{width:100%;background:var(--sf);border:2px solid var(--bd);border-radius:16px;padding:18px 94px 18px 20px;color:var(--tx);font-size:19px;font-weight:500;min-height:60px;outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--ac);}
.search-input::placeholder{color:var(--mu);}
.search-clear{position:absolute;right:60px;top:50%;transform:translateY(-50%);background:var(--sf2);border:none;color:var(--sb);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;display:none;}
.search-clear.show{display:block;}
.search-mic{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--sf2);border:1px solid var(--bd);color:var(--sb);width:42px;height:42px;border-radius:50%;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;padding:0;}
.search-mic:active{border-color:var(--ac);color:var(--ac);}
.search-mic.listening{background:var(--rd);border-color:var(--rd);color:#fff;animation:mic-pulse 1.2s ease-in-out infinite;}
.search-mic.unsupported{opacity:.4;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,108,117,.45);}50%{box-shadow:0 0 0 9px rgba(224,108,117,0);}}
.voice-status{display:none;align-items:center;gap:8px;color:var(--ac2);font-size:13px;font-weight:500;margin:0 0 16px 4px;}
.voice-status.show{display:flex;}
.voice-status .dot{width:8px;height:8px;border-radius:50%;background:var(--rd);flex-shrink:0;animation:mic-pulse 1.2s ease-in-out infinite;}

.result-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;}
.result-card:active{border-color:var(--ac);}
.result-name{font-size:22px;font-weight:900;letter-spacing:.02em;margin-bottom:2px;}
.result-sub{font-size:12px;color:var(--mu);margin-bottom:12px;}
.result-bottles{display:flex;flex-wrap:wrap;gap:10px;}
.bottle-chip{background:var(--sf2);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;align-items:flex-start;min-width:96px;}
.bottle-chip .bc-brand{font-size:15px;font-weight:700;color:var(--tx);}
.bottle-chip .bc-num{font-family:'DM Mono',monospace;font-size:26px;font-weight:700;color:var(--ac2);letter-spacing:.02em;}
.bottle-chip.disposed{opacity:.45;}
.bottle-chip.expired{border-color:rgba(224,108,117,.5);}
.bottle-chip.expiring_soon{border-color:rgba(240,160,88,.5);}
.no-bottle{font-size:12px;color:var(--mu);}
.empty-hint{text-align:center;color:var(--mu);font-size:14px;padding:40px 20px;}

/* ── DASHBOARD CARDS ── */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
.dash-card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;cursor:pointer;transition:border-color .15s;}
.dash-card:active{border-color:var(--ac);}
.dash-card .dl{font-size:11px;letter-spacing:.1em;color:var(--mu);margin-bottom:8px;}
.dash-card .dv{font-family:'DM Mono',monospace;font-size:30px;font-weight:700;color:var(--ac2);}
.dash-card .dv .du{font-size:13px;color:var(--mu);margin-left:4px;}
.dash-card.warn .dv{color:var(--or);}
.dash-card.danger .dv{color:var(--rd);}
.dash-card.full{grid-column:1/-1;}

/* ── CARDS / FORM ── */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:14px;}
.ct{font-size:11px;letter-spacing:.2em;color:var(--ac);text-transform:uppercase;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;}
.ph{margin-bottom:18px;}
.ph .ey{font-size:10px;letter-spacing:.3em;color:var(--ac);text-transform:uppercase;margin-bottom:5px;}
.ph h2{font-size:21px;font-weight:700;}
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:12px;color:var(--mu);margin-bottom:6px;letter-spacing:.06em;}
.field label .req{color:var(--rd);margin-left:3px;}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:13px 14px;color:var(--tx);font-family:'Noto Sans JP',sans-serif;font-size:16px;min-height:48px;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none;}
select{color-scheme:dark;}
input[type=date]{color-scheme:dark;}
textarea{min-height:88px;resize:vertical;}
input:focus,select:focus,textarea:focus{border-color:var(--ac);}
input::placeholder,textarea::placeholder{color:var(--bd);}
.hint{font-size:12px;color:var(--mu);margin-top:6px;}
.hint.warn{color:var(--or);}
.hint.err{color:var(--rd);}

.btn-p{width:100%;background:var(--ac);border:none;border-radius:14px;padding:18px;min-height:58px;color:#0a0a0f;font-family:'Noto Sans JP',sans-serif;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.06em;transition:all .2s;}
.btn-p:active{background:var(--ac2);}
.btn-p:disabled{opacity:.4;}
.btn-visit{width:100%;background:var(--gn);border:none;border-radius:16px;padding:22px;min-height:68px;color:#0a0a0f;font-size:19px;font-weight:900;cursor:pointer;letter-spacing:.1em;margin:6px 0 16px;}
.btn-visit:active{filter:brightness(1.1);}
.btn-danger{width:100%;background:var(--rd);border:none;border-radius:14px;padding:18px;min-height:58px;color:#1a0a0a;font-size:16px;font-weight:700;cursor:pointer;}
.btn-danger:active{filter:brightness(1.1);}
.btn-s{width:100%;background:none;border:1px solid var(--bd);border-radius:12px;padding:14px;min-height:50px;color:var(--sb);font-size:14px;cursor:pointer;transition:all .2s;}
.btn-s:active{border-color:var(--ac);color:var(--ac);}
.btn-row{display:flex;gap:10px;}
.btn-row>*{flex:1;}
.be{background:none;border:1px solid rgba(200,169,110,.35);border-radius:9px;padding:9px 14px;min-height:38px;color:var(--ac);font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.be:active{background:var(--acd);}
.bd2{background:none;border:1px solid rgba(224,108,117,.35);border-radius:9px;padding:9px 14px;min-height:38px;color:var(--rd);font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.bd2:active{background:rgba(224,108,117,.1);}

/* ── BADGE / STATUS ── */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;letter-spacing:.03em;}
.badge-keeping{background:rgba(94,203,138,.13);color:var(--gn);border:1px solid rgba(94,203,138,.3);}
.badge-expiring_soon{background:rgba(240,160,88,.13);color:var(--or);border:1px solid rgba(240,160,88,.3);}
.badge-expired{background:rgba(224,108,117,.13);color:var(--rd);border:1px solid rgba(224,108,117,.3);}
.badge-disposed{background:rgba(106,106,138,.13);color:var(--mu);border:1px solid rgba(106,106,138,.3);}

/* ── BOTTLE ROW (big number) ── */
.bottle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--sf2);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;}
.bottle-row:active{border-color:var(--ac);}
.bottle-row .bl{flex:1;min-width:0;}
.bottle-row .bl .bn-brand{font-size:16px;font-weight:700;margin-bottom:4px;}
.bottle-row .bl .bn-num{font-family:'DM Mono',monospace;font-size:30px;font-weight:900;color:var(--ac2);}
.bottle-row .br{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.bottle-row .exp{font-size:11px;color:var(--mu);}

/* ── LIST ROW ── */
.li-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(39,39,56,.6);gap:10px;}
.li-row:last-child{border-bottom:none;}
.li-row .ll{min-width:0;flex:1;}
.li-row .ln{font-size:15px;font-weight:600;}
.li-row .ls{font-size:12px;color:var(--mu);margin-top:2px;}

/* ── FILTER BAR ── */
.fbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.fsel,.finp{background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;min-height:42px;color:var(--tx);font-size:13px;outline:none;}
.fsel:focus,.finp:focus{border-color:var(--ac);}
.finp{flex:1;min-width:120px;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:9px 16px;font-size:13px;color:var(--sb);cursor:pointer;}
.chip.active{background:var(--ac);border-color:var(--ac);color:#0a0a0f;font-weight:700;}

/* ── TABLE (admin) ── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:560px;}
th{text-align:left;padding:10px 8px;font-size:10px;letter-spacing:.08em;color:var(--mu);text-transform:uppercase;border-bottom:1px solid var(--bd);font-weight:400;}
td{padding:11px 8px;border-bottom:1px solid rgba(39,39,56,.5);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.tm{font-family:'DM Mono',monospace;}

/* ── TOAST ── */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--gn);color:#0a0a0f;padding:14px 22px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:400;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(6,6,10,.72);z-index:500;display:none;align-items:flex-end;justify-content:center;padding:0;}
.overlay.show{display:flex;}
.sheet{background:var(--sf);border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-top:1px solid var(--bd);animation:slideup .2s ease-out;}
@keyframes slideup{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:16px;}
.sheet .close{position:absolute;}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(39,39,56,.6);font-size:14px;}
.kv:last-of-type{border-bottom:none;}
.kv .kk{color:var(--mu);}
.kv .kvv{font-weight:600;text-align:right;}

/* ── SEARCHABLE BRAND COMBO ── */
.combo{position:relative;}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sf2);border:1px solid var(--bd);border-radius:10px;max-height:240px;overflow-y:auto;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.4);display:none;}
.combo-list.show{display:block;}
.combo-item{padding:13px 14px;font-size:15px;cursor:pointer;border-bottom:1px solid rgba(39,39,56,.6);min-height:44px;display:flex;align-items:center;}
.combo-item:last-child{border-bottom:none;}
.combo-item:active,.combo-item.hi{background:var(--acd);color:var(--ac);}
.combo-empty{padding:13px 14px;font-size:13px;color:var(--mu);}
.combo-selected{border-color:var(--ac) !important;}

/* ── STAFF PICKER ── */
.staff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0;}
.staff-btn{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px 10px;font-size:17px;font-weight:700;color:var(--tx);cursor:pointer;text-align:center;min-height:64px;}
.staff-btn:active{border-color:var(--ac);color:var(--ac);}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto;}
.login-logo{text-align:center;margin-bottom:36px;}
.login-logo .lg1{font-size:12px;letter-spacing:.4em;color:var(--ac);margin-bottom:8px;}
.login-logo .lg2{font-size:26px;font-weight:900;}
.login-err{color:var(--rd);font-size:13px;text-align:center;margin-top:10px;min-height:18px;}

/* ── BOTTOM NAV ── */
nav.bn{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(19,19,28,.97);backdrop-filter:blur(12px);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.bn-btn{flex:1;background:none;border:none;color:var(--mu);font-size:10px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:52px;}
.bn-btn .bi{font-size:21px;}
.bn-btn.active{color:var(--ac);}

.section-title{font-size:13px;font-weight:700;color:var(--sb);margin:20px 0 10px;letter-spacing:.04em;}
.section-title:first-child{margin-top:0;}
.tabbar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
.tabbar .tb{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--sb);white-space:nowrap;cursor:pointer;}
.tabbar .tb.active{background:var(--ac);border-color:var(--ac);color:#0a0a0f;font-weight:700;}
.hidden{display:none !important;}
.spinner{border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;width:28px;height:28px;animation:spin .7s linear infinite;margin:30px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.center-msg{text-align:center;color:var(--mu);font-size:14px;padding:30px 0;}
</style>
</head>
<body>

<!-- ══════════ ログイン画面 ══════════ -->
<div id="screen-login" class="screen active full" style="padding:0;">
  <div class="login-wrap">
    <div class="login-logo">
      <div class="lg1">KEEP BOTTLE</div>
      <div class="lg2">キープボトル管理</div>
    </div>
    <div class="field">
      <label>メールアドレス</label>
      <input type="text" id="login-email" autocomplete="username" placeholder="store@example.com">
    </div>
    <div class="field">
      <label>パスワード</label>
      <input type="text" id="login-pass" autocomplete="current-password" placeholder="パスワード" style="-webkit-text-security:disc;text-security:disc;">
    </div>
    <button class="btn-p" id="login-btn" onclick="doLogin()" style="margin-top:6px;">ログイン</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- ══════════ スタッフ選択画面 ══════════ -->
<div id="screen-staffpick" class="screen full" style="padding:0;">
  <div class="login-wrap">
    <div class="login-logo">
      <div class="lg1">STAFF</div>
      <div class="lg2">あなたのお名前は？</div>
    </div>
    <div class="hint" style="text-align:center;margin-bottom:6px;">来店登録・廃棄記録などに使われます</div>
    <div class="staff-grid" id="staffpick-grid"></div>
    <div class="field" style="margin-top:6px;">
      <label>名簿にない場合は追加できます</label>
      <div class="btn-row">
        <input type="text" id="staffpick-newname" placeholder="スタッフ名">
        <button class="be" style="min-width:80px;" onclick="addStaffAndPick()">追加</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════ アプリ本体 ══════════ -->
<div id="app-root" style="display:none;">
  <div class="topbar">
    <button class="back" id="topbar-back" onclick="goBack()">←</button>
    <div class="brand" id="topbar-title">キープボトル管理</div>
    <div class="staffpill" id="topbar-staff"></div>
  </div>

  <!-- ホーム -->
  <div id="screen-home" class="screen"></div>
  <!-- 期限管理 -->
  <div id="screen-expiry" class="screen"></div>
  <!-- 空き番号 -->
  <div id="screen-numbers" class="screen"></div>
  <!-- メニュー -->
  <div id="screen-menu" class="screen"></div>
  <!-- お客様詳細 -->
  <div id="screen-customer" class="screen"></div>
  <!-- お客様登録・編集 -->
  <div id="screen-customer-form" class="screen"></div>
  <!-- ボトル登録・編集 -->
  <div id="screen-bottle-form" class="screen"></div>
  <!-- 銘柄管理 -->
  <div id="screen-brands" class="screen"></div>
  <!-- 銘柄別お客様一覧 -->
  <div id="screen-brand-customers" class="screen"></div>
  <!-- スタッフ名簿 -->
  <div id="screen-staff" class="screen"></div>
  <!-- 廃棄履歴 -->
  <div id="screen-disposals" class="screen"></div>
  <!-- 操作履歴 -->
  <div id="screen-audit" class="screen"></div>
  <!-- 店舗管理 -->
  <div id="screen-stores" class="screen"></div>
  <!-- CSV出力 -->
  <div id="screen-csv" class="screen"></div>
  <!-- データ管理(完全削除・管理者) -->
  <div id="screen-datamanage" class="screen"></div>

  <nav class="bn">
    <button class="bn-btn active" data-nav="home" onclick="goHome()"><div class="bi">🏠</div>ホーム</button>
    <button class="bn-btn" data-nav="expiry" onclick="navTo('expiry')"><div class="bi">⏰</div>期限管理</button>
    <button class="bn-btn" data-nav="numbers" onclick="navTo('numbers')"><div class="bi">🔢</div>空き番号</button>
    <button class="bn-btn" data-nav="menu" onclick="navTo('menu')"><div class="bi">☰</div>メニュー</button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<!-- 廃棄確認シート -->
<div class="overlay" id="dispose-overlay">
  <div class="sheet">
    <h3>この内容で廃棄しますか？</h3>
    <div id="dispose-body"></div>
  </div>
</div>

<!-- 同姓同名警告シート -->
<div class="overlay" id="dup-overlay">
  <div class="sheet">
    <h3>同じ名前のお客様が登録されています</h3>
    <div id="dup-body"></div>
  </div>
</div>

<!-- 同日来店確認シート -->
<div class="overlay" id="visit-overlay">
  <div class="sheet">
    <h3>本日はすでに来店登録されています</h3>
    <div id="visit-body"></div>

/* ── フリガナ正規化（ひらがな統一・ひらがな/カタカナ/半角カタカナを同一視した検索）──
   .normalize('NFKC') で半角カタカナ→全角カタカナ・全角英数記号の統一まで済ませ、
   そのあとカタカナの文字コードを -0x60 してひらがなへ変換する。 */
function katakanaToHiragana(str){
  return String(str||'').replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0x60));
}
// フリガナ欄の保存用：ひらがなに統一し、前後の空白・連続する空白を整える（読みやすさのため単一の空白は残す）
function normalizeKanaText(str){
  if(!str) return '';
  const hira = katakanaToHiragana(String(str).normalize('NFKC'));
  return hira.trim().replace(/[\s　]+/g,' ');
}
// 大文字/小文字・全角/半角・ひらがな/カタカナの違いだけを吸収する下地（記号・空白はここでは触らない）
function normalizeChars(str){
  return katakanaToHiragana(String(str||'').normalize('NFKC')).toLowerCase();
}
const SEARCH_PUNCT_RE = /[。、,.!?！？…・･]/g; // 検索時に無視する記号（音声認識結果に付きやすいものを含む）
// 検索比較専用：大文字/小文字・全角/半角・ひらがな/カタカナ・記号・空白の違いをすべて吸収する（1本の文字列として厳密一致・部分一致を見る用）
function normalizeForSearch(str){
  if(!str) return '';
  let s = normalizeChars(str);
  s = s.replace(SEARCH_PUNCT_RE,''); // 記号を除去
  s = s.trim().replace(/[\s　]+/g,''); // 前後・連続する空白を除去
  s = s.replace(/(さん|様)$/,''); // 末尾の敬称（さん／様）を除去
  return s;
}
// 検索比較用：記号やスペースを「単語の区切り」として複数語に分割する（部分一致・複数語検索、あいまい一致の元データ用）
function tokenizeForSearch(str){
  if(!str) return [];
  const s = normalizeChars(str);
  return s.split(/[。、,.!?！？…・･\s　]+/)
    .map(t=>t.replace(/(さん|様)$/,''))
    .filter(Boolean);
}
// 簡易レーベンシュタイン距離（音声認識特有の軽微な誤変換を吸収するためのあいまい一致用）
function levenshteinDistance(a,b){
  const al=a.length, bl=b.length;
  if(al===0) return bl;
  if(bl===0) return al;
  let prev = new Array(bl+1);
  for(let j=0;j<=bl;j++) prev[j]=j;
  for(let i=1;i<=al;i++){
    const cur=[i];
    for(let j=1;j<=bl;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    prev = cur;
  }
  return prev[bl];
}
function searchSimilarity(a,b){
  if(!a || !b) return 0;
  const dist = levenshteinDistance(a,b);
  return 1 - dist/Math.max(a.length,b.length);
}
const FUZZY_MATCH_THRESHOLD = 0.6; // これ未満は「別物」とみなして候補に出さない
// 音声認識が「みずなら」を「水なら」のように漢字混じりで書き起こす、といった
// ごく一部の代表的な読み間違いだけを、安全な範囲で吸収するためのヒント辞書。
// （お客様名の一致判定そのものには使わず、検索語のゆらぎ候補を増やす用途のみに使う）
const KANJI_READING_HINTS = {'水':'みず'};
function withKanjiReadingHints(token){
  let out = token;
  Object.keys(KANJI_READING_HINTS).forEach(k=>{
    if(out.indexOf(k)!==-1) out = out.split(k).join(KANJI_READING_HINTS[k]);
  });
  return out;
}
// 1つの項目（お客様名・フリガナ・銘柄名など）に対する一致度を返す。
// 3=通常の部分一致（従来通り） / 2=複数語すべてが個別に含まれる語順違い一致 / 1〜1.5=音声認識のゆらぎを想定したあいまい一致 / 0=不一致
function fieldMatchScore(fieldValue, queryNorm, queryTokens){
  if(!fieldValue) return 0;
  const normField = normalizeForSearch(fieldValue);
  if(!normField) return 0;
  if(queryNorm && normField.includes(queryNorm)) return 3;
  const hinted = queryTokens.map(withKanjiReadingHints);
  const tokenHit = (t,i)=> (t.length>=1 && normField.includes(t)) || (hinted[i].length>=1 && normField.includes(hinted[i]));
  if(queryTokens.length>1 && queryTokens.every((t,i)=>tokenHit(t,i))) return 2;
  if(queryTokens.some((t,i)=> t.length>=2 && tokenHit(t,i))) return 2;
  const queryHinted = withKanjiReadingHints(queryNorm);
  if(queryNorm.length>=2){
    const sim = Math.max(searchSimilarity(queryNorm, normField), searchSimilarity(queryHinted, normField));
    if(sim>=FUZZY_MATCH_THRESHOLD) return 1+sim*0.5;
  }
  return 0;
}

function activeScopeIds(){

async function loadScopeData(){
  const ids = isAdmin() ? scopeStoreIds : scopeStoreIds; // admin: 全店舗キャッシュ、表示時にフィルタ
  const [staffRes, brandRes, custRes, bottleRes] = await Promise.all([
    sb.from('staff_members').select('*').in('store_id',ids).order('name'),
    sb.from('bottle_brands').select('*').in('store_id',ids).order('sort_order'), // 非表示分も含めて取得（銘柄管理画面の再表示用）
    sb.from('customers').select('*').in('store_id',ids).is('deleted_at',null).order('name'),
    sb.from('v_bottles').select('*').in('store_id',ids)
  ]);
  staffMembers = staffRes.data||[];
  brands = brandRes.data||[];
  customers = custRes.data||[];
  bottles = bottleRes.data||[];
}

function subscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); }
  realtimeChannel = sb.channel('kb-realtime')
    .on('postgres_changes',{event:'*',schema:'public',table:'customers'},handleCustomerRT)
    .on('postgres_changes',{event:'*',schema:'public',table:'bottles'},()=>reloadBottlesQuiet())
    .on('postgres_changes',{event:'*',schema:'public',table:'bottle_brands'},()=>reloadBrandsQuiet())
    .on('postgres_changes',{event:'*',schema:'public',table:'staff_members'},()=>reloadStaffQuiet())
    .subscribe();
}
function handleCustomerRT(payload){
  if(payload.eventType==='DELETE'){
    customers = customers.filter(c=>c.id!==payload.old.id);
  } else {
    const row=payload.new;
    if(row.deleted_at){ customers=customers.filter(c=>c.id!==row.id); }
    else {
      const idx=customers.findIndex(c=>c.id===row.id);
      if(idx>=0) customers[idx]=row; else customers.push(row);
    }
  }
  if(curScreen==='home') renderHome();
}
async function reloadBottlesQuiet(){
  const {data} = await sb.from('v_bottles').select('*').in('store_id',scopeStoreIds);
  bottles = data||bottles;
  if(curScreen==='home') renderHome();
  if(curScreen==='expiry') renderExpiry();
  if(curScreen==='customer') renderCustomerDetail(curParams);
}
async function reloadBrandsQuiet(){
  const {data} = await sb.from('bottle_brands').select('*').in('store_id',scopeStoreIds).order('sort_order');

}
async function reloadStaffQuiet(){
  const {data} = await sb.from('staff_members').select('*').in('store_id',scopeStoreIds).order('name');

}

/* ============================================================
   音声検索（Web Speech API / ブラウザ標準機能のみ・外部送信サーバー等の追加実装なし）

============================================================ */
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let voiceRecognizer = null;
let voiceListening = false;

function voiceSearchSupported(){
  return !!SpeechRecognitionCtor;
}

  if(!voiceSearchSupported()){
    toast('この端末・ブラウザでは音声検索を利用できません','var(--rd)');
    return;
  }
  if(voiceListening){
    if(voiceRecognizer){ try{ voiceRecognizer.stop(); }catch(e){} }
    return;
  }
  startVoiceSearch();
}
function startVoiceSearch(){
  let rec;
  try{
    rec = new SpeechRecognitionCtor();
  }catch(e){
    toast('この端末・ブラウザでは音声検索を利用できません','var(--rd)');
    return;
  }
  voiceRecognizer = rec;
  rec.lang = 'ja-JP';
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  rec.onresult = (ev)=>{
    // 発話の区切り方によっては results に複数の確定結果が入ることがあるため、
    // 先頭(results[0])だけでなく確定済みの結果をすべてつなげて検索語にする
    let transcript = '';
    if(ev.results){
      for(let i=0;i<ev.results.length;i++){
        const r = ev.results[i];
        if(r && r[0] && r.isFinal !== false) transcript += r[0].transcript;
      }
    }
    transcript = transcript.trim();
    if(!transcript){
      toast('音声を認識できませんでした。もう一度お試しください。','var(--rd)');
      return;
    }
    applyVoiceSearchText(transcript);
  };
  rec.onerror = (ev)=>{
    if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
      toast('マイクの使用が許可されていません。ブラウザやOSの設定でこのサイトのマイクへのアクセスを許可してください。','var(--rd)');
    } else {
      toast('音声を認識できませんでした。もう一度お試しください。','var(--rd)');
    }
  };
  rec.onend = ()=>{
    voiceListening = false;
    updateMicButtonUI();
    hideVoiceStatus();
  };

  voiceListening = true;
  updateMicButtonUI();
  showVoiceStatus('🎙 音声を聞いています…');
  try{
    rec.start();
  }catch(e){
    voiceListening = false;
    updateMicButtonUI();
    hideVoiceStatus();
    toast('音声を認識できませんでした。もう一度お試しください。','var(--rd)');
  }
}
// 「五番」「5番」のような読み上げは、できる範囲で数字としても検索を試みる
// （「ナンバーワン」のような言い回しは番号との対応が不確実なため対象外）
const KANJI_NUM_MAP = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function extractSpokenNumber(text){
  const m = String(text||'').match(/([0-9]+|[一二三四五六七八九十])\s*番/);
  if(!m) return null;
  const raw = m[1];
  if(/^[0-9]+$/.test(raw)) return raw;
  return KANJI_NUM_MAP[raw] ? String(KANJI_NUM_MAP[raw]) : null;
}
function applyVoiceSearchText(transcript){
  const box = $('search-box');
  if(!box) return;
  box.value = transcript;
  onSearchInput();
  const noHit = $('home-body') && $('home-body').querySelector('.empty-hint');
  if(noHit){
    const num = extractSpokenNumber(transcript);
    if(num){ box.value = num; onSearchInput(); }
  }
}
function scopedCustomers(){
  const ids=activeScopeIds();
  return customers.filter(c=>ids.includes(c.store_id));
}
function scopedBottles(){
  const ids=activeScopeIds();
  return bottles.filter(b=>ids.includes(b.store_id));
}
// お客様1名分の一致度（氏名・フリガナ・会社名・領収書名・所有ボトルの銘柄／番号のうち最も強い一致を採用）
function customerSearchScore(c, custBottles, queryNorm, queryTokens){
  let best=0;
  [c.name,c.kana,c.company,c.receipt_name].forEach(v=>{
    best = Math.max(best, fieldMatchScore(v, queryNorm, queryTokens));
  });
  custBottles.forEach(b=>{
    if(b.brand_name) best = Math.max(best, fieldMatchScore(b.brand_name, queryNorm, queryTokens));
    const br = brands.find(x=>x.id===b.brand_id);
    if(br && br.reading) best = Math.max(best, fieldMatchScore(br.reading, queryNorm, queryTokens));
    if(queryNorm && String(b.number).includes(queryNorm)) best = Math.max(best, 3); // 番号はあいまい一致の対象外（数字は完全一致寄りが安全）
  });
  return best;
}
function renderSearchResults(q){
  const queryNorm = normalizeForSearch(q);
  const queryTokens = tokenizeForSearch(q);
  const custs=scopedCustomers();
  const bts=scopedBottles();
  const matched = custs.map(c=>{
    const cb = bts.filter(b=>b.customer_id===c.id);
    return {c, cb, score: customerSearchScore(c, cb, queryNorm, queryTokens)};
  }).filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,60);

  const body=$('home-body');
  if(!matched.length){
    body.innerHTML = `<div class="empty-hint">「${esc(q)}」に一致するお客様が見つかりません</div>`;
    // 診断用ログ（画面には出さず、ブラウザの開発者ツール Console にのみ出力する）。
    // 実データで検索が一致しない原因調査のため、正規化後の検索語と
    // スコープ内の件数・銘柄一覧を出しておく。
    try{
      console.debug('[keep-bottle search miss]', {
        rawQuery:q, queryNorm, queryTokens,
        scopedCustomerCount:custs.length, scopedBottleCount:bts.length,
        scopeIds:activeScopeIds(), isAdmin:isAdmin(), adminStoreFilter,
        brandNamesInScope:[...new Set(bts.map(b=>b.brand_name))]
      });
    }catch(e){}
    return;
  }
  body.innerHTML = matched.map(({c})=>{
    const cb = bts.filter(b=>b.customer_id===c.id && b.status==='keeping');
    const bottlesHtml = cb.length
      ? `<div class="result-bottles">${cb.map(b=>`<div class="bottle-chip ${b.display_status}"><div class="bc-brand">${esc(b.brand_name)}</div><div class="bc-num">No.${b.number}</div></div>`).join('')}</div>`
      : `<div class="no-bottle">保管中のボトルはありません</div>`;
    return `<div class="result-card" onclick="navTo('customer',{id:'${c.id}'})">
      <div class="result-name">${esc(c.name)} 様</div>
      <div class="result-sub">${c.company?esc(c.company)+' / ':''}${isAdmin()?esc(storeName(c.store_id)):''}</div>
      ${bottlesHtml}
    </div>`;
  }).join('');
}

    ? list.map(b=>`<div class="combo-item" onmousedown="pickBrand('${prefix}','${b.id}')">${esc(b.name)}</div>`).join('')
    : `<div class="combo-empty">一致する銘柄がありません。メニューの「ボトル銘柄管理」から追加できます。</div>`;
  box.classList.add('show');
}
function closeBrandList(prefix){
  const box=$(prefix+'-brand-list');
  if(box) box.classList.remove('show');
}
function pickBrand(prefix,brandId){
  const b = (bfBrandList[prefix]||[]).find(x=>x.id===brandId);
  if(!b) return;
  $(prefix+'-brand').value=b.id;
  $(prefix+'-brand-text').value=b.name;
  closeBrandList(prefix);
  onBrandChange(prefix);
}
function usedNumbersFor(storeId,brandId){
  return bottles.filter(b=>b.store_id===storeId && b.brand_id===brandId && b.status==='keeping').map(b=>b.number).sort((a,b)=>a-b);
}
function suggestNumber(used){
  if(!used.length) return 1;
  for(let i=1;i<=used.length;i++){ if(!used.includes(i)) return i; }
  return Math.max(...used)+1;
}
function onBrandChange(prefix){
  const brandId = $(prefix+'-brand').value;
  const storeId = bfStoreMap[prefix];
  const used = usedNumbersFor(storeId, brandId);
  const s = suggestNumber(used);
  $(prefix+'-suggest').textContent = brandId ? `おすすめ No.${s}（使用中: ${used.join('、')||'なし'}）` : '';
  if(!$(prefix+'-number').value) $(prefix+'-number').value=s;
  validateNumberField(prefix);
}
function validateNumberField(prefix){
  const brandId=$(prefix+'-brand').value;
  const numEl=$(prefix+'-number');
  const hint=$(prefix+'-suggest');
  if(!brandId || !numEl.value) return true;
  const storeId = bfStoreMap[prefix];
  const used = usedNumbersFor(storeId, brandId);
  const n = parseInt(numEl.value,10);
  if(used.includes(n)){
    hint.innerHTML = `<span style="color:var(--rd);">この番号は現在使用中です</span>`;
    return false;
  }
  hint.innerHTML = `おすすめ No.${suggestNumber(used)}（使用中: ${used.join('、')||'なし'}）`;
  return true;
}
function readBottleFields(prefix){
  const brandId=$(prefix+'-brand').value, numEl=$(prefix+'-number'), dateEl=$(prefix+'-date');
  if(!brandId||!numEl.value) return null;
  const b = (bfBrandList[prefix]||[]).find(x=>x.id===brandId);
  return {brandId, brandName: b?b.name:'', number:parseInt(numEl.value,10), registeredAt:dateEl.value||jstTodayStr()};
}
async function createBottleRow(customerId, storeId, fields){
  if(!validateNumberFieldRaw(storeId,fields.brandId,fields.number)){
    toast('この番号は現在使用中のため登録できませんでした','var(--rd)');
    return null;
  }
  const payload={
    store_id: storeId, customer_id: customerId, brand_id: fields.brandId, brand_name: fields.brandName,
    number: fields.number, registered_at: fields.registeredAt, status:'keeping',
    created_by: session.user.id, updated_by: session.user.id
  };
  const {data,error} = await sb.from('bottles').insert(payload).select().single();
  if(error){
    if(error.code==='23505') toast('この番号は現在使用中です','var(--rd)');
    else toast('ボトルを登録できませんでした','var(--rd)');
    return null;
  }
  await sb.from('bottle_history').insert({bottle_id:data.id,customer_id:customerId,store_id:storeId,event_type:'registered',after:payload,staff_member_id:currentStaff.id,staff_member_name:currentStaff.name,created_by:session.user.id});
  await logAudit('bottle_create',{customer_id:customerId,bottle_id:data.id,after:payload,store_id:storeId});
  return data;
}
function validateNumberFieldRaw(storeId,brandId,number){
  const used = usedNumbersFor(storeId,brandId);
  return !used.includes(number);
}

async function submitExpiryChange(bottleId){
  const b=bottles.find(x=>x.id===bottleId);
  const newDate=$('bf-expiry').value;
  if(!newDate) return;
  const before={expires_at:b.expires_at};
  const {error}=await sb.from('bottles').update({expires_at:newDate,updated_at:new Date().toISOString()}).eq('id',bottleId);
  if(error){ toast('変更できませんでした','var(--rd)'); return; }
  await sb.from('bottle_history').insert({bottle_id:bottleId,customer_id:b.customer_id,store_id:b.store_id,event_type:'expiry_changed',before,after:{expires_at:newDate},staff_member_id:currentStaff.id,staff_member_name:currentStaff.name,created_by:session.user.id});
  await logAudit('expiry_change',{customer_id:b.customer_id,bottle_id:bottleId,before,after:{expires_at:newDate},store_id:b.store_id});
  toast('保管期限を変更しました');
  await loadScopeData();
  renderBottleForm({mode:'view',id:bottleId});
}
async function submitNumberChange(bottleId){
  const b=bottles.find(x=>x.id===bottleId);
  const newNum=parseInt($('bf-number').value,10);
  if(!newNum || newNum===b.number) return;
  const used=usedNumbersFor(b.store_id,b.brand_id).filter(n=>n!==b.number);
  if(used.includes(newNum)){ toast('この番号は現在使用中です','var(--rd)'); return; }
  const before={number:b.number};
  const {error}=await sb.from('bottles').update({number:newNum,updated_at:new Date().toISOString()}).eq('id',bottleId);
  if(error){ toast(error.code==='23505'?'この番号は現在使用中です':'変更できませんでした','var(--rd)'); return; }
  await sb.from('bottle_history').insert({bottle_id:bottleId,customer_id:b.customer_id,store_id:b.store_id,event_type:'number_changed',before,after:{number:newNum},staff_member_id:currentStaff.id,staff_member_name:currentStaff.name,created_by:session.user.id});
  await logAudit('number_change',{customer_id:b.customer_id,bottle_id:bottleId,before,after:{number:newNum},store_id:b.store_id});
  toast('番号を変更しました');
  await loadScopeData();
  renderBottleForm({mode:'view',id:bottleId});
}

async function addBrand(storeId){
  const nameEl=$('brand-new-name');
  const readingEl=$('brand-new-reading');
  const name=nameEl.value.trim();
  if(!name){ toast('銘柄名を入力してください','var(--rd)'); return; }
  const reading = normalizeKanaText(readingEl?readingEl.value:'')||null;
  const norm = normBrandName(name);
  const existing = brands.filter(b=>b.store_id===storeId);
  const activeDup = existing.find(b=>!b.deleted_at && normBrandName(b.name)===norm);
  if(activeDup){ toast('この銘柄はすでに登録されています','var(--rd)'); return; }

/* ============================================================
   銘柄別お客様一覧
   （現在「保管中」のボトルだけを対象に、銘柄ごとに保有客をまとめる。
    新しいテーブルは使わず、既存の customers / bottles / bottle_brands
    キャッシュから毎回その場で集計する）
============================================================ */
// 五十音インデックス（お客様一覧の見出し用）。フリガナはひらがな統一済みの前提。
const GOJUON_ROWS = [
  {label:'あ行', chars:'あいうえおぁぃぅぇぉ'},
  {label:'か行', chars:'かきくけこがぎぐげごゕゖ'},
  {label:'さ行', chars:'さしすせそざじずぜぞ'},
  {label:'た行', chars:'たちつてとだぢづでどっ'},
  {label:'な行', chars:'なにぬねの'},
  {label:'は行', chars:'はひふへほばびぶべぼぱぴぷぺぽ'},
  {label:'ま行', chars:'まみむめも'},
  {label:'や行', chars:'やゆよゃゅょ'},
  {label:'ら行', chars:'らりるれろ'},
  {label:'わ行', chars:'わをんゎ'},
];
const UNREGISTERED_KANA_LABEL = 'フリガナ未登録';
function gojuonRowFor(kana){
  if(!kana) return null;
  const hira = katakanaToHiragana(String(kana).normalize('NFKC')).trim();
  const ch = hira[0];
  if(!ch) return null;
  const row = GOJUON_ROWS.find(r=>r.chars.includes(ch));
  return row ? row.label : null;
}
// 店舗内で「現在保管中のボトルが1本でもある銘柄」だけを一覧化（使用停止中でも保有者がいれば表示）
function brandsInUseForStore(storeId){
  const usedBrandIds = new Set(
    bottles.filter(b=>b.store_id===storeId && b.status==='keeping').map(b=>b.brand_id)
  );
  return brands.filter(b=>b.store_id===storeId && usedBrandIds.has(b.id))
    .sort((a,b)=>a.sort_order-b.sort_order);
}
// 指定銘柄・指定店舗の保有客（お客様ごとに番号をまとめる。廃棄済み・保管中以外は対象外）
function brandHolders(storeId, brandId){
  const map = new Map();
  bottles.filter(b=>b.store_id===storeId && b.brand_id===brandId && b.status==='keeping')
    .forEach(b=>{
      if(!map.has(b.customer_id)) map.set(b.customer_id, []);
      map.get(b.customer_id).push(b.number);
    });
  const rows=[];
  map.forEach((numbers,customerId)=>{
    const c = customers.find(x=>x.id===customerId);
    if(!c) return; // キャッシュ不整合時は安全側で除外
    numbers.sort((a,b)=>a-b);
    rows.push({ customer:c, numbers, row: c.kana ? (gojuonRowFor(c.kana)||UNREGISTERED_KANA_LABEL) : UNREGISTERED_KANA_LABEL });
  });
  return rows;
}
function renderBrandCustomers(params){

function renderBrandCustomersDetail(brandId){
  const brand = brands.find(b=>b.id===brandId);
  if(!brand){ toast('銘柄が見つかりません','var(--rd)'); goBack(); return; }
  if(!isAdmin() && brand.store_id!==myProfile.store_id){ toast('この銘柄は表示できません','var(--rd)'); goBack(); return; }
  const holders = brandHolders(brand.store_id, brandId);
  const grouped = {};
  holders.forEach(h=>{ (grouped[h.row]=grouped[h.row]||[]).push(h); });
  const rowOrder = GOJUON_ROWS.map(r=>r.label).concat([UNREGISTERED_KANA_LABEL]);
  const sections = rowOrder.map(label=>{
    const items = (grouped[label]||[]).sort((a,b)=>(a.customer.kana||'').localeCompare(b.customer.kana||'','ja'));
    if(!items.length) return '';
    return `<div class="section-title">${esc(label)}</div>` + items.map(h=>`

  }).join('');
  $('screen-brand-customers').innerHTML = `
    <div class="ph"><div class="ey">${esc(brand.reading||'BRAND')}</div><h2>${esc(brand.name)}</h2></div>
    <div style="color:var(--mu);font-size:13px;margin-bottom:14px;">保管中のお客様 ${holders.length}名</div>
    ${holders.length ? sections : `<div class="empty-hint">現在このボトルを保管しているお客様はいません</div>`}

}

function csvEscape(v){
  const s = v==null?'':String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCsv(filename,rows){
  const csv = '\uFEFF'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function exportCsv(kind){
  const storeSel = $('csv-store').value;
  const ids = storeSel==='all' ? allStores.map(s=>s.id) : [storeSel];
  if(kind==='customers'){
    const {data}=await sb.from('customers').select('*').in('store_id',ids).is('deleted_at',null);
    const rows=[['店舗','お客様名','フリガナ','会社名','領収書名','電話番号','メモ','最終来店日','累計来店回数','登録日','更新日']];
    (data||[]).forEach(c=>rows.push([storeName(c.store_id),c.name,c.kana,c.company,c.receipt_name,c.phone,c.memo,fmtDate(c.last_visit_at),c.visit_count,fmtDate(c.created_at),fmtDate(c.updated_at)]));
    downloadCsv('顧客一覧.csv',rows);
  } else if(kind==='bottles'){
    const {data}=await sb.from('v_bottles').select('*').in('store_id',ids).eq('status','keeping');
    const rows=[['店舗','お客様名','銘柄','番号','登録日','最終来店日','保管期限','状態']];
    (data||[]).forEach(b=>rows.push([b.store_name,b.customer_name,b.brand_name,b.number,fmtDate(b.registered_at),fmtDate(b.last_visit_at),fmtDate(b.expires_at),statusLabel(b.display_status)]));
    downloadCsv('保管中ボトル一覧.csv',rows);
  } else if(kind==='visits'){
    const {data}=await sb.from('visits').select('*, customers(name), stores(name)').in('store_id',ids).order('visited_at',{ascending:false}).limit(5000);
    const rows=[['来店日時','店舗','お客様名','担当スタッフ']];
    (data||[]).forEach(v=>rows.push([fmtDateTime(v.visited_at), v.stores?v.stores.name:'', v.customers?v.customers.name:'', v.staff_member_name]));
    downloadCsv('来店履歴.csv',rows);
  } else if(kind==='disposals'){
    const {data}=await sb.from('bottle_disposals').select('*').in('store_id',ids).order('disposed_at',{ascending:false}).limit(5000);
    const rows=[['廃棄日時','店舗','お客様','銘柄','番号','廃棄理由','担当スタッフ','備考']];
    (data||[]).forEach(d=>rows.push([fmtDateTime(d.disposed_at),d.store_name,d.customer_name,d.brand_name,d.number,reasonLabel(d.reason),d.staff_member_name,d.note]));
    downloadCsv('廃棄履歴.csv',rows);
  } else if(kind==='allbottles'){
    const {data}=await sb.from('v_bottles').select('*').in('store_id',ids);
    const rows=[['店舗','お客様名','銘柄','番号','登録日','最終来店日','保管期限','状態']];
    (data||[]).forEach(b=>rows.push([b.store_name,b.customer_name,b.brand_name,b.number,fmtDate(b.registered_at),fmtDate(b.last_visit_at),fmtDate(b.expires_at),statusLabel(b.display_status)]));
    downloadCsv('全ボトル履歴.csv',rows);
  }
  toast('CSVをダウンロードしました');
}

/* ============================================================
   データ管理（完全削除・管理者専用）
============================================================ */
function renderDataManage(){
  if(!isAdmin()){ $('screen-datamanage').innerHTML=`<div class="empty-hint">権限がありません</div>`; return; }
  const deleted = customers.filter(c=>false); // 論理削除済みは通常キャッシュに含まれないため個別取得
  $('screen-datamanage').innerHTML = `
    <div class="ph"><div class="ey">DATA</div><h2>データ管理</h2></div>
    <div class="hint" style="margin-bottom:14px;">誤って登録したお客様を、論理削除（一覧から非表示）→完全削除の順で処理できます。通常の操作では行わないでください。</div>
    <div class="card">
      <div class="ct">お客様を検索して削除</div>
      <input type="text" id="dm-search" placeholder="お客様名で検索" oninput="dmSearch()">
      <div id="dm-results" style="margin-top:12px;"></div>
    </div>
  `;
}
function dmSearch(){
  const q=$('dm-search').value.trim().toLowerCase();
  const box=$('dm-results');
  if(!q){ box.innerHTML=''; return; }
  const list = customers.filter(c=>c.name.toLowerCase().includes(q)).slice(0,20);
  box.innerHTML = list.map(c=>`<div class="li-row"><div class="ll"><div class="ln">${esc(c.name)}</div><div class="ls">${esc(storeName(c.store_id))}</div></div>
    <button class="bd2" onclick="softDeleteCustomer('${c.id}')">論理削除</button></div>`).join('') || `<div class="center-msg">該当なし</div>`;
}
async function softDeleteCustomer(id){
  if(!confirm) {}
  const c=customers.find(x=>x.id===id);
  showConfirm('お客様を削除しますか？',`${esc(c.name)}様を一覧から非表示にします。完全削除ではありません。`, async ()=>{
    await sb.from('customers').update({deleted_at:new Date().toISOString(),deleted_by:session.user.id}).eq('id',id);
    await logAudit('customer_update',{customer_id:id,after:{deleted:true},store_id:c.store_id});
    toast('削除しました');
    await loadScopeData();
    renderDataManage();
  });
}
function showConfirm(title,body,onYes){
  $('confirm-title').textContent=title;
  $('confirm-body').innerHTML = `<div style="color:var(--sb);font-size:14px;margin-bottom:16px;">${body}</div>
    <div class="btn-row"><button class="btn-s" onclick="closeOverlay('confirm-overlay')">キャンセル</button><button class="btn-danger" id="confirm-yes">実行する</button></div>`;
  $('confirm-yes').onclick=()=>{ closeOverlay('confirm-overlay'); onYes(); };
  $('confirm-overlay').classList.add('show');
}
</script>
